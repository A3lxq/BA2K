[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackarch2kali"
version = "0.1.0"
description = "BlackArch package intelligence, compatibility analysis and installation management for Kali Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "PyYAML>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "types-PyYAML", "respx>=0.21", "build"]

[project.scripts]
blackarch2kali = "blackarch2kali.cli:app"

[tool.setuptools.packages.find]
include = ["blackarch2kali*"]

[tool.setuptools.package-data]
blackarch2kali = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "SIM115", "E731"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["blackarch2kali"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["blackarch2kali"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
