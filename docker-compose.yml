services:
  ba2k:
    build: .
    image: ba2k:local
    command: ["sync", "--schedule"]      # scheduled metadata sync only; never installs anything
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}     # optional; read from your shell/.env, never baked into the image
    volumes:
      - ba2k-data:/data                   # SQLite state, cache, generated reports
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    privileged: false
    restart: unless-stopped
    # no network_mode: host; default bridge network only
volumes:
  ba2k-data:
