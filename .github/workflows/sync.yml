name: sync
# Scheduled METADATA synchronization. It never installs software, never runs upstream code, and its
# pull request may only touch data/ and generated reports - never scripts or workflows.
on:
  schedule:
    - cron: "23 3 * * 1"   # weekly; edit to change cadence
  workflow_dispatch:
    inputs:
      max_repos:
        description: "Max GitHub repositories to refresh this run"
        default: "400"
permissions:
  contents: read
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: ba2k-state-${{ github.run_id }}
          restore-keys: ba2k-state-
      - name: Synchronize metadata (incremental, rate-limit aware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '400' }}
        run: blackarch2kali sync --max-repos "$MAX_REPOS"
      - name: Guard - only data and report paths may change
        run: |
          set -euo pipefail
          git add -N data generated 2>/dev/null || true
          bad=$(git diff --name-only | grep -Ev '^(data/|generated/reports/|generated/categories/|generated/dependency_)' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes outside data/report paths:"; echo "$bad"; exit 1; fi
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/sync
          title: "data: scheduled BlackArch metadata sync"
          body: "Automated metadata refresh (inventory, compatibility, risk). Review before merging. No installers or scripts are modified by this workflow."
          commit-message: "data: scheduled BlackArch metadata sync"
          add-paths: |
            data/
            generated/reports/
            generated/categories/
            generated/dependency_graph.json
            generated/dependency_report.md
          delete-branch: true
